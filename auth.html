<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account — Custom Demands</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  
  <nav class="anav">
    <a href="index.html" class="anav-logo">Custom<strong>Demands</strong></a>
    <a href="index.html" class="anav-back">← Back to site</a>
  </nav>

  <div class="redir-overlay" id="redirOverlay">
    <div class="redir-spin"></div>
    <p>Redirecting…</p>
  </div>

  <main class="amain">
    <!-- SIGN IN -->
    <section class="ascreen" id="screenSignIn">
      <div class="acard">
        <h1 class="ahead">Welcome Back</h1>
        <p class="asub">Sign in to manage your identity.</p>
        <button class="btn-google" id="btnGoogle">
          <!-- Clean Google Icon SVG -->
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <p class="aerr" id="signInError"></p>
      </div>
    </section>

    <!-- ALREADY SIGNED IN -->
    <section class="ascreen" id="screenAlready" style="display:none">
      <div class="acard text-center">
        <div class="already-wrap">
          <img src="" alt="" id="alreadyAvatar" class="already-avatar"/>
        </div>
        <h1 class="ahead" id="alreadyTitle">Hey, @user</h1>
        <p class="asub" id="alreadyEmail">email</p>
        <div class="auth-btns">
          <a href="index.html" class="btn-full">Go to Homepage</a>
          <a href="auth.html?settings" class="btn-full outline">Account Settings</a>
          <button class="btn-signout-alt" id="btnAlreadySignOut">Sign out</button>
        </div>
      </div>
    </section>

    <!-- PICK USERNAME -->
    <section class="ascreen" id="screenUsername" style="display:none">
      <div class="acard">
        <h1 class="ahead">Choose Username</h1>
        <p class="asub">Pick a unique handle for your account.</p>
        <div class="afield">
          <div class="ainput-wrap">
            <span class="ainput-pre">@</span>
            <input id="unInput" type="text" class="ainput" placeholder="yourcoolname" maxlength="24"/>
          </div>
        </div>
        <p class="aerr" id="unError"></p>
        <button class="btn-full" id="btnSaveUsername">Save &amp; Continue</button>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="ascreen wide" id="screenSettings" style="display:none">
      <div class="acard wide">
        <div class="sprofile">
          <img src="" alt="" id="spAvatar" class="sprofile-img"/>
          <div>
            <div class="sprofile-un" id="spUsername">@username</div>
            <div class="sprofile-email" id="spEmail">email</div>
          </div>
        </div>
        
        <h2 class="spanel-title">Edit Username</h2>
        <div class="afield">
          <div class="ainput-wrap">
            <span class="ainput-pre">@</span>
            <input id="settingsUsername" type="text" class="ainput" placeholder="username" maxlength="24"/>
          </div>
        </div>
        <p class="aerr" id="sError"></p>
        <p class="aok" id="sSuccess"></p>
        <button class="btn-full" id="btnSaveSettings">Save Changes</button>

        <hr class="divider">

        <h2 class="spanel-title">Account Session</h2>
        <button class="btn-full outline alert-btn" id="btnSignOut">Sign Out</button>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
